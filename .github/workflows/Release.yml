name: Release
on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

jobs:
  release:
    name: Build and release
    runs-on: ubuntu-latest
    env:
      GOTOOLCHAIN: local
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Ensure tag is on main
        run: |
          git fetch origin main
          if ! git merge-base --is-ancestor "${GITHUB_SHA}" origin/main; then
            echo "::error::Tag ${GITHUB_REF_NAME} is not on the main branch."
            exit 1
          fi

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Build release binaries
        run: |
          set -euo pipefail

          app_name="SVNArchiver"
          version="${GITHUB_REF_NAME}"
          out_dir="${GITHUB_WORKSPACE}/dist"
          mkdir -p "${out_dir}"

          targets=(
            "linux/amd64"
            "linux/arm64"
            "windows/amd64"
            "windows/arm64"
            "darwin/amd64"
            "darwin/arm64"
          )

          for target in "${targets[@]}"; do
            goos="${target%/*}"
            goarch="${target#*/}"
            bin_name="${app_name}"
            if [[ "${goos}" == "windows" ]]; then
              bin_name="${bin_name}.exe"
            fi

            work_dir="$(mktemp -d)"
            echo "Building ${goos}/${goarch}..."
            CGO_ENABLED=0 GOOS="${goos}" GOARCH="${goarch}" \
              go build -trimpath -ldflags "-s -w" -o "${work_dir}/${bin_name}" ./src

            cp LICENSE README.md README_EN.md "${work_dir}/"

            archive_base="${app_name}_${version}_${goos}_${goarch}"
            if [[ "${goos}" == "windows" ]]; then
              (cd "${work_dir}" && zip -q "${out_dir}/${archive_base}.zip" ./*)
            else
              tar -C "${work_dir}" -czf "${out_dir}/${archive_base}.tar.gz" .
            fi
          done

          (cd "${out_dir}" && sha256sum * > SHA256SUMS.txt)
          ls -lh "${out_dir}"

      - name: Create GitHub Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          notes_file="notes/release/ReleaseNotes_${GITHUB_REF_NAME}.md"
          prerelease_flag=()
          if [[ "${GITHUB_REF_NAME}" == *-* ]]; then
            prerelease_flag=(--prerelease)
          fi

          create_args=(
            "${GITHUB_REF_NAME}"
            dist/*
            --title "${GITHUB_REF_NAME}"
            "${prerelease_flag[@]}"
          )

          if [[ -f "${notes_file}" ]]; then
            create_args+=(--notes-file "${notes_file}")
          else
            create_args+=(--generate-notes)
          fi

          if gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1; then
            gh release upload "${GITHUB_REF_NAME}" dist/* --clobber
          else
            gh release create "${create_args[@]}"
          fi
